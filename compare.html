                        if (!elecVal) elecVal = val;
                    }
                    // 3. Engine Torque / แรงบิดสูงสุด (เครื่องยนต์ - ระบุรอบต่อนาที / rpm หรือ engine torque)
                    else if ((topLower.includes('แรงบิดสูงสุด') && (topLower.includes('รอบต่อนาที') || topLower.includes('rpm'))) || topLower.includes('engine torque')) {
                        if (!engVal) engVal = val;
                    }
                    // 4. Maximum Torque general
                    else if (topLower.includes('แรงบิดสูงสุด') || topLower.includes('maximum torque') || topLower.includes('max. torque')) {
                        if (!maxVal) maxVal = val;
                    }
                }
            }

            if (totVal) {
                const totNums = totVal.match(/\d+/g) || [];
                const engNums = engVal ? (engVal.match(/\d+/g) || []) : [];
                let isHybridDiff = false;
                if (engVal && totNums.length >= 1 && engNums.length >= 1) {
                    if (totNums[0] !== engNums[0]) {
                        isHybridDiff = true;
                    }
                }

                if (isHybridDiff) {
                    const label = isTh ? 'เครื่องยนต์: ' : 'Engine: ';
                    const html = `<div style="display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.3;">
                        <span style="font-weight:700;">${totVal}</span>
                        <span style="font-size:0.83em; color:var(--text-secondary);">${label}${engVal}</span>
                    </div>`;
                    return { value: totVal, isCustomHtml: true, html: html };
                } else {
                    const chosen = engVal || totVal;
                    return { value: chosen, isCustomHtml: false, isTextOption: true };
                }
            }

            if (engVal) {
                return { value: engVal, isCustomHtml: false, isTextOption: true };
            }
            if (elecVal) {
                return { value: elecVal, isCustomHtml: false, isTextOption: true };
            }
            if (maxVal) {
                return { value: maxVal, isCustomHtml: false, isTextOption: true };
            }

            return { value: '-', isCustomHtml: false };
        }

        // Helper: Find value from model's specifications matching a set of aliases (searches by alias priority)
        function findSpecValueByAliases(model, aliases, preferTopicAsValue = false) {
            // Priority 1: Check aliases in order of preference for active/present values
            for (const alias of aliases) {
                const aliasLower = cleanThai(alias).toLowerCase();
                for (const specBlock of (model.specifications || [])) {
                    for (const detail of (specBlock.details || [])) {
                        const top = cleanThai(detail.topic || '').trim();
                        const topLower = top.toLowerCase();
                        if (topLower.includes(aliasLower)) {
                            const val = (detail.value || '').trim();
                            const isCheckMark = TRANSLATIONS[currentLang].yesWords.includes(val.toLowerCase());
                            const isActive = val !== '' && val !== '-' && val.toLowerCase() !== 'null' && val.toLowerCase() !== 'none';
                            
                            if (isActive) {
                                if (preferTopicAsValue) {
                                    const displayVal = isCheckMark ? top : val;
                                    return { value: displayVal, topic: top, isTextOption: true };
                                }
                                return { value: val, topic: top, isTextOption: false };
                            }
                        }
                    }
                }
            }

            // Priority 2: Check if any alias matched with '-' (explicitly not equipped)
            for (const alias of aliases) {
                const aliasLower = cleanThai(alias).toLowerCase();
                for (const specBlock of (model.specifications || [])) {
                    for (const detail of (specBlock.details || [])) {
                        const top = cleanThai(detail.topic || '').trim();
                        if (top.toLowerCase().includes(aliasLower)) {
                            return { value: '-', topic: top, isTextOption: false };
                        }
                    }
                }
            }
            return { value: '-', topic: '', isTextOption: false };
        }

        // 4. Populate Table Body
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        totalDiffCount = 0;
        totalAllEmptyCount = 0;

        if (currentViewMode === 'smart') {
            // === SMART SALES HIGHLIGHTS MODE ===
            SMART_GROUPS_DEF.forEach(group => {
                const groupTitle = currentLang === 'en' ? group.titleEN : group.titleTH;
                
                // Section Title Row
                const trSection = document.createElement('tr');
                trSection.className = 'section-title';
                const tdSection = document.createElement('td');
                tdSection.colSpan = selectedModels.length + 1;
                tdSection.innerText = groupTitle;
                trSection.appendChild(tdSection);
                tbody.appendChild(trSection);

                group.topics.forEach(tDef => {
                    const topicLabel = currentLang === 'en' ? tDef.canonicalNameEN : tDef.canonicalNameTH;
                    const tr = document.createElement('tr');
                    tr.setAttribute('data-category', groupTitle);
                    tr.setAttribute('data-topic', topicLabel);

                    const isSuspensionRow = (tDef.canonicalNameTH === 'ระบบช่วงล่าง' || tDef.canonicalNameEN === 'Suspension');
                    const tdTopic = document.createElement('td');
                    const salesBadge = isSuspensionRow ? '' : getSalesBadge(topicLabel);
                    tdTopic.innerHTML = `${salesBadge}${addFootnoteTooltips(topicLabel)}`;
                    tr.appendChild(tdTopic);

                    let normalizedValues = [];

                    selectedModels.forEach(m => {
                        let res;
                        if (tDef.customPowerExtractor) {
                            res = getPowerInfo(m);
                        } else if (tDef.customTorqueExtractor) {
                            res = getTorqueInfo(m);
                        } else if (tDef.customChargingExtractor) {
                            res = getChargingInfo(m);
                        } else if (tDef.customElectricRangeExtractor) {
                            res = getElectricRange(m);
                        } else if (tDef.customConsumptionExtractor) {
                            res = getConsumptionInfo(m);
                        } else if (tDef.customSeatExtractor) {
                            res = getCombinedSeatInfo(m);
                        } else if (tDef.customCockpitExtractor) {
                            res = getCockpitInfo(m);
                        } else if (tDef.customHUDExtractor) {
                            res = getHUDInfo(m);
                        } else if (tDef.customDrivetrainExtractor) {
                            res = getDrivetrainInfo(m);
                        } else if (tDef.customActiveCruiseExtractor) {
                            res = getActiveCruiseControlInfo(m);
                        } else if (tDef.customAirbagExtractor) {
                            res = getAirbagInfo(m);
                        } else if (tDef.customIASExtractor) {
                            res = getIASInfo(m);
                        } else if (tDef.customACExtractor) {
                            res = getAirConditioningInfo(m);
                        } else if (tDef.customSunblindExtractor) {
                            res = getSunblindInfo(m);
                        } else if (tDef.customSpecialExteriorExtractor) {
                            res = getSpecialExteriorEquipment(m);
                        } else if (tDef.customSpecialInteriorExtractor) {
                            res = getSpecialInteriorEquipment(m);
                        } else {
                            res = findSpecValueByAliases(m, tDef.aliases, tDef.preferTopicAsValue);
                        }
                        const specVal = res.value;

                        const tdVal = document.createElement('td');
                        let cellContent = '';

                        if (res.isCustomHtml) {
                            // Rich multi-line content (e.g. seat style + electric/memory + leather material)
                            cellContent = res.html;
                        } else if (res.isTextOption) {
                            // Render text directly without checkmark icon
                            const badge = isSuspensionRow ? '' : getSalesBadge(specVal);
                            cellContent = `<span style="font-weight:600;">${badge}${specVal}</span>`;
                        } else {
                            // Clean value rendering without redundant sub-topic labels
                            cellContent = formatValue(specVal);
                            if (res.badge) {
                                cellContent = `<div style="display:flex; flex-direction:column; align-items:center; gap:3px;">${cellContent}<span class="badge-acc-included">${res.badge}</span></div>`;
                            }
                        }
                        
                        tdVal.innerHTML = addFootnoteTooltips(cellContent, true);
                        tr.appendChild(tdVal);

                        normalizedValues.push(normalizeForDiff(specVal));
                    });

                    // Diff evaluation
                    const firstVal = normalizedValues[0];
                    const isDiff = normalizedValues.some(v => v !== firstVal);
                    const isAllEmpty = normalizedValues.every(v => v === "__NO__");

                    if (isAllEmpty) {
                        tr.classList.add('row-all-empty');
                        totalAllEmptyCount++;
                    }

                    if (isDiff) {
                        tr.classList.add('row-diff');
                        totalDiffCount++;
                    } else {
                        tr.classList.add('row-same');
                        if (isDiffOnly) {
                            tr.classList.add('hide-same');
                        }
                    }

                    tbody.appendChild(tr);
                });
            });

        } else {
            // === RAW ORIGINAL BROCHURE MODE ===
            let allCategories = [];
            selectedModels.forEach(m => {
                (m.specifications || []).forEach(spec => {
                    if (spec.category && !allCategories.includes(spec.category)) {
                        allCategories.push(spec.category);
                    }
                });
            });

            // Sort categories by score
            const catWithScores = allCategories.map((cat, origIdx) => ({
                name: cat,
                origIdx,
                score: getCategoryScore(cat)
            }));
            catWithScores.sort((a, b) => a.score !== b.score ? a.score - b.score : a.origIdx - b.origIdx);
            allCategories = catWithScores.map(c => c.name);

            allCategories.forEach(categoryName => {
                const lowerCat = categoryName.toLowerCase().trim();
                if (lowerCat === "หมายเหตุ" || lowerCat === "notes" || lowerCat === "footnote" || lowerCat === "footnotes") {
                    return;
                }

                // Union unique topics in this category
                let uniqueTopics = [];
                selectedModels.forEach(m => {
                    const specBlock = (m.specifications || []).find(s => s.category === categoryName);
                    if (specBlock) {
                        (specBlock.details || []).forEach(detail => {
                            if (detail.topic) {
                                const cleanT = cleanThai(detail.topic);
                                if (!uniqueTopics.some(t => cleanThai(t) === cleanT)) {
                                    uniqueTopics.push(detail.topic);
                                }
                            }
                        });
                    }
                });

                if (uniqueTopics.length === 0) return;

                // Section Title Row
                const trSection = document.createElement('tr');
                trSection.className = 'section-title';
                const tdSection = document.createElement('td');
                tdSection.colSpan = selectedModels.length + 1;
                tdSection.innerText = categoryName;
                trSection.appendChild(tdSection);
                tbody.appendChild(trSection);

                uniqueTopics.forEach(topicName => {
                    const tr = document.createElement('tr');
                    tr.setAttribute('data-category', categoryName);
                    tr.setAttribute('data-topic', topicName);

                    const tdTopic = document.createElement('td');
                    const salesBadge = getSalesBadge(topicName);
                    tdTopic.innerHTML = `${salesBadge}${addFootnoteTooltips(topicName)}`;
                    tr.appendChild(tdTopic);

                    let normalizedValues = [];

                    selectedModels.forEach(m => {
                        let specVal = "-";
                        const specBlock = (m.specifications || []).find(s => s.category === categoryName);
                        if (specBlock) {
                            const detail = (specBlock.details || []).find(d => cleanThai(d.topic) === cleanThai(topicName));
                            if (detail) specVal = detail.value;
                        }

                        const tdVal = document.createElement('td');
                        tdVal.innerHTML = addFootnoteTooltips(formatValue(specVal), true);
                        tr.appendChild(tdVal);

                        normalizedValues.push(normalizeForDiff(specVal));
                    });

                    // Diff evaluation
                    const firstVal = normalizedValues[0];
                    const isDiff = normalizedValues.some(v => v !== firstVal);
                    const isAllEmpty = normalizedValues.every(v => v === "__NO__");

                    if (isAllEmpty) {
                        tr.classList.add('row-all-empty');
                        totalAllEmptyCount++;
                    }

                    if (isDiff) {
                        tr.classList.add('row-diff');
                        totalDiffCount++;
                    } else {
                        tr.classList.add('row-same');
                        if (isDiffOnly) {
                            tr.classList.add('hide-same');
                        }
                    }

                    tbody.appendChild(tr);
                });
            });
        }

        // 5. PDF Brochure Links Row
        const trPdfSection = document.createElement('tr');
        trPdfSection.className = 'section-title';
        const tdPdfSection = document.createElement('td');
        tdPdfSection.colSpan = selectedModels.length + 1;
        tdPdfSection.innerText = trans.sourceDocSection;
        trPdfSection.appendChild(tdPdfSection);
        tbody.appendChild(trPdfSection);

        const trPdfRow = document.createElement('tr');
        const tdPdfLabel = document.createElement('td');
        tdPdfLabel.innerText = "PDF Source";
        trPdfRow.appendChild(tdPdfLabel);

        selectedModels.forEach(m => {
            const tdPdf = document.createElement('td');
            if (m.pdfUrl) {
                tdPdf.innerHTML = `
                    <a href="${m.pdfUrl}" target="_blank" rel="noopener noreferrer" style="color:var(--accent-color); font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:4px; font-size:0.85em;">
                        <span>📄</span> <span>${trans.openPdfLabel}</span>
                    </a>
                `;
            } else {
                tdPdf.innerHTML = `<span class="dash-icon">-</span>`;
            }
            trPdfRow.appendChild(tdPdf);
        });
        tbody.appendChild(trPdfRow);

        // Update Diff Counter Badge
        document.getElementById('diffCounterBadge').innerText = `${totalDiffCount} ${trans.diffPointsSuffix}`;

        // Update All-Empty Counter Badge & Toggle button state
        const emptyBadge = document.getElementById('allEmptyCounterBadge');
        if (emptyBadge) {
            emptyBadge.innerText = `${totalAllEmptyCount} ${trans.allEmptySuffix}`;
        }
        const btnHide = document.getElementById('btnHideEmptyToggle');
        if (btnHide) {
            btnHide.classList.toggle('active', isHideAllEmpty);
            btnHide.querySelector('span:first-child').innerText = isHideAllEmpty ? trans.hideAllEmptyText : trans.showAllEmptyText;
        }

        // Reapply current search query and diff filtering to category headers
        applyFilters();

        // Update URL State
        updateUrlState();
    }

    // Toggle Diff Only Mode
    function toggleDiffOnly() {
        isDiffOnly = !isDiffOnly;
        const btn = document.getElementById('btnDiffToggle');
        const trans = TRANSLATIONS[currentLang];
        
        if (isDiffOnly) {
            btn.classList.add('active');
            btn.querySelector('span:first-child').innerText = trans.diffOnlyText;
        } else {
            btn.classList.remove('active');
            btn.querySelector('span:first-child').innerText = trans.diffOnlyText;
        }

        applyFilters();
        updateUrlState();
    }

    // Toggle Hide All-Empty Mode
    function toggleHideAllEmpty() {
        isHideAllEmpty = !isHideAllEmpty;
        const btn = document.getElementById('btnHideEmptyToggle');
        const trans = TRANSLATIONS[currentLang];
        
        if (isHideAllEmpty) {
            btn.classList.add('active');
            btn.querySelector('span:first-child').innerText = trans.hideAllEmptyText;
        } else {
            btn.classList.remove('active');
            btn.querySelector('span:first-child').innerText = trans.showAllEmptyText;
        }

        applyFilters();
        updateUrlState();
    }

    // Apply combined Diff, Hide All-Empty & Search filtering
    function applyFilters() {
        const query = cleanThai(document.getElementById('searchInput').value).toLowerCase().trim();
        const rows = document.querySelectorAll('#tableBody tr');
        let currentSectionHeader = null;
        let sectionHasVisibleRows = false;

        rows.forEach(row => {
            if (row.classList.contains('section-title')) {
                if (currentSectionHeader) {
                    currentSectionHeader.style.display = sectionHasVisibleRows ? '' : 'none';
                }
                currentSectionHeader = row;
                sectionHasVisibleRows = false;
            } else {
                let matchesSearch = true;
                if (query) {
                    const rowText = cleanThai(row.innerText).toLowerCase();
                    matchesSearch = rowText.includes(query);
                }

                if (!matchesSearch) {
                    row.classList.add('hide-search');
                } else {
                    row.classList.remove('hide-search');
                }

                // Filtering conditions
                let shouldHide = false;
                if (isDiffOnly && row.classList.contains('row-same')) {
                    shouldHide = true;
                }
                // Smart Search: If the user searches for a specific keyword, reveal it even if all models are empty!
                // If there is no active search query, hide all-empty rows when isHideAllEmpty is enabled.
                if (!query && isHideAllEmpty && row.classList.contains('row-all-empty')) {
                    shouldHide = true;
                }

                if (shouldHide || !matchesSearch) {
                    row.style.display = 'none';
                } else {
                    row.style.display = '';
                    sectionHasVisibleRows = true;
                }
            }
        });

        if (currentSectionHeader) {
            currentSectionHeader.style.display = sectionHasVisibleRows ? '' : 'none';
        }
    }

    // Search input listener
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    // Remove a model from comparison
    function removeModelSlot(index) {
        if (selectedModelIds.length <= 2) return;
        selectedModelIds.splice(index, 1);
        saveTrayToLocalStorage();
        renderComparator();
    }

    // Reset comparison to default models
    function resetComparison() {
        if (flatCatalog.length >= 2) {
            selectedModelIds = [flatCatalog[0].id, flatCatalog[1].id];
            isDiffOnly = false;
            isHideAllEmpty = true;
            document.getElementById('searchInput').value = '';
            document.getElementById('btnDiffToggle').classList.remove('active');
            const btnHide = document.getElementById('btnHideEmptyToggle');
            if (btnHide) btnHide.classList.add('active');
            saveTrayToLocalStorage();
            renderComparator();
        }
    }

    // Sync with localStorage tray
    function saveTrayToLocalStorage() {
        try {
            const trayItems = selectedModelIds.map(id => {
                const m = getModelById(id);
                if (!m) return null;
                return {
                    id: m.id,
                    source: m.source,
                    seriesIndex: m.seriesIndex,
                    modelIndex: m.modelIndex,
                    seriesName: m.seriesName,
                    modelName: m.modelName,
                    image: getModelThumbnail(m)
                };
            }).filter(Boolean);
            localStorage.setItem('bmw_compare_tray', JSON.stringify(trayItems));
        } catch(e) {}
    }

    function loadTrayFromLocalStorage() {
        try {
            const raw = localStorage.getItem('bmw_compare_tray');
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed) && parsed.length >= 2) {
                    const validIds = parsed.map(item => {
                        const m = getModelById(item);
                        return m ? m.id : null;
                    }).filter(Boolean);
                    if (validIds.length >= 2) {
                        return [...new Set(validIds)].slice(0, 4);
                    }
                }
            }
        } catch(e) {}
        return null;
    }

    // View Mode Switcher ('smart' vs 'raw')
    function setViewMode(mode) {
        if (currentViewMode === mode) return;
        currentViewMode = mode;
        const btnSmart = document.getElementById('btnViewSmart');
        const btnRaw = document.getElementById('btnViewRaw');
        if (btnSmart) btnSmart.classList.toggle('active', mode === 'smart');
        if (btnRaw) btnRaw.classList.toggle('active', mode === 'raw');
        
        renderComparator();
        updateUrlState();
    }

    // URL State Sharing
    function updateUrlState() {
        const params = new URLSearchParams();
        if (selectedModelIds.length > 0) {
            params.set('models', selectedModelIds.join(','));
        }
        if (isDiffOnly) {
            params.set('diff', '1');
        }
        if (!isHideAllEmpty) {
            params.set('hide_empty', '0');
        }
        if (currentViewMode !== 'smart') {
            params.set('view', currentViewMode);
        }
        if (currentLang !== 'th') {
            params.set('lang', currentLang);
        }
        const newUrl = window.location.pathname + '?' + params.toString();
        window.history.replaceState({}, '', newUrl);
    }

    function parseUrlState() {
        const params = new URLSearchParams(window.location.search);
        const modelsParam = params.get('models');
        const diffParam = params.get('diff');
        const hideEmptyParam = params.get('hide_empty');
        const viewParam = params.get('view');
        const langParam = params.get('lang');

        if (langParam === 'en' || langParam === 'th') {
            currentLang = langParam;
        }

        if (viewParam === 'raw' || viewParam === 'smart') {
            currentViewMode = viewParam;
            const btnSmart = document.getElementById('btnViewSmart');
            const btnRaw = document.getElementById('btnViewRaw');
            if (btnSmart) btnSmart.classList.toggle('active', currentViewMode === 'smart');
            if (btnRaw) btnRaw.classList.toggle('active', currentViewMode === 'raw');
        }

        if (diffParam === '1') {
            isDiffOnly = true;
            document.getElementById('btnDiffToggle').classList.add('active');
        }

        if (hideEmptyParam === '0') {
            isHideAllEmpty = false;
            const btnHide = document.getElementById('btnHideEmptyToggle');
            if (btnHide) btnHide.classList.remove('active');
        } else if (hideEmptyParam === '1') {
            isHideAllEmpty = true;
            const btnHide = document.getElementById('btnHideEmptyToggle');
            if (btnHide) btnHide.classList.add('active');
        }

        if (modelsParam) {
            const ids = modelsParam.split(',').filter(id => getModelById(id));
            if (ids.length >= 2) {
                selectedModelIds = ids.slice(0, 4);
                return true;
            }
        }
        return false;
    }

    // Copy Share Link
    function copyShareLink() {
        updateUrlState();
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
            showToast(TRANSLATIONS[currentLang].linkCopied);
        }).catch(() => {
            // Fallback for older browsers
            prompt("คัดลอกลิงก์:", url);
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toastNotification');
        document.getElementById('toastMessage').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Model Selector Modal Logic
    function openModelModal(slotIndex) {
        targetSlotIndex = slotIndex;
        document.getElementById('modalSearchInput').value = '';
        modalActiveTab = 'all';
        renderModalCarList();
        document.getElementById('modelModal').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeModelModal() {
        document.getElementById('modelModal').classList.remove('open');
        document.body.style.overflow = '';
        targetSlotIndex = null;
    }

    function setModalTab(tab) {
        modalActiveTab = tab;
        document.querySelectorAll('.modal-tab-btn').forEach(btn => btn.classList.remove('active'));
        if (tab === 'all') document.getElementById('tabAll').classList.add('active');
        if (tab === 'active') document.getElementById('tabActive').classList.add('active');
        if (tab === 'custom') document.getElementById('tabCustom').classList.add('active');
        renderModalCarList();
    }

    function renderModalCarList() {
        const container = document.getElementById('modalCarList');
        const query = cleanThai(document.getElementById('modalSearchInput').value).toLowerCase().trim();
        const trans = TRANSLATIONS[currentLang];
        container.innerHTML = '';

        let filtered = flatCatalog.filter(item => {
            if (modalActiveTab === 'active' && item.source !== 'act') return false;
            if (modalActiveTab === 'custom' && item.source !== 'cust') return false;
            if (query) {
                const combined = cleanThai(`${item.seriesName} ${item.modelName}`).toLowerCase();
                return combined.includes(query);
            }
            return true;
        });

        filtered.forEach(item => {
            const isAlreadySelected = selectedModelIds.includes(item.id);
            const div = document.createElement('div');
            div.className = 'modal-car-item' + (isAlreadySelected ? ' disabled' : '');
            
            const badgeText = item.source === 'act' ? trans.badgeActive : trans.badgeCustom;
            const badgeClass = item.source === 'act' ? 'badge-active' : 'badge-custom';

            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="slot-badge ${badgeClass}">${badgeText}</span>
                    ${isAlreadySelected ? `<span style="font-size:0.7em; color:var(--text-secondary); font-weight:600;">${trans.alreadySelected}</span>` : ''}
                </div>
                <div class="modal-car-item-title">${item.modelName}</div>
                <div class="modal-car-item-series">${item.seriesName}</div>
            `;

            if (!isAlreadySelected) {
                div.onclick = () => selectModelFromModal(item.id);
            }
            container.appendChild(div);
        });
    }

    document.getElementById('modalSearchInput').addEventListener('input', renderModalCarList);

    function selectModelFromModal(id) {
        if (targetSlotIndex !== null) {
            if (targetSlotIndex < selectedModelIds.length) {
                // Replace existing slot
                selectedModelIds[targetSlotIndex] = id;
            } else if (selectedModelIds.length < 4) {
                // Add new slot
                selectedModelIds.push(id);
            }
        }
        closeModelModal();
        saveTrayToLocalStorage();
        renderComparator();
    }

    // Close modal on click outside
    document.getElementById('modelModal').addEventListener('click', function(e) {
        if (e.target === this) closeModelModal();
    });

    // Full-screen image modal
    function openImageModal(src, alt) {
        let modal = document.getElementById('imageFullScreenModal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'imageFullScreenModal';
            modal.className = 'full-screen-image-modal';
            modal.innerHTML = `
                <button style="position:absolute; top:20px; right:25px; font-size:40px; color:white; background:none; border:none; cursor:pointer;" onclick="closeImageModal()">&times;</button>
                <img id="modalFullScreenImg" class="modal-content-img" src="" alt="">
            `;
            modal.addEventListener('click', e => { if (e.target === modal) closeImageModal(); });
            document.body.appendChild(modal);
        }
        document.getElementById('modalFullScreenImg').src = src;
        document.getElementById('modalFullScreenImg').alt = alt;
        modal.classList.add('show-modal');
        document.body.style.overflow = 'hidden';
    }

    function closeImageModal() {
        const modal = document.getElementById('imageFullScreenModal');
        if (modal) modal.classList.remove('show-modal');
        document.body.style.overflow = '';
    }

    // Footnote Tooltip Hover Delegation
    const compareTable = document.getElementById('compareTable');
    if (compareTable) {
        compareTable.addEventListener('mouseover', function(e) {
            const trigger = e.target.closest('.footnote-trigger');
            if (!trigger) return;

            const text = trigger.getAttribute('data-tooltip');
            if (!text) return;

            tooltipEl.innerText = text;
            tooltipEl.classList.add('show');

            const rect = trigger.getBoundingClientRect();
            let top = rect.top + window.scrollY - tooltipEl.offsetHeight - 8;
            let left = rect.left + window.scrollX + rect.width / 2 - tooltipEl.offsetWidth / 2;

            if (left < 12) left = 12;
            const maxLeft = window.innerWidth - tooltipEl.offsetWidth - 12;
            if (left > maxLeft) left = maxLeft;

            tooltipEl.style.top = top + 'px';
            tooltipEl.style.left = left + 'px';
        });

        compareTable.addEventListener('mouseout', function(e) {
            const trigger = e.target.closest('.footnote-trigger');
            if (!trigger) return;
            tooltipEl.classList.remove('show');
        });
    }

    // Language switch
    function setLanguage(lang) {
        if (currentLang === lang) return;
        currentLang = lang;
        document.getElementById('langTh').classList.toggle('active', lang === 'th');
        document.getElementById('langEn').classList.toggle('active', lang === 'en');
        updateStaticTexts();
        loadComparisonData();
    }

    function updateStaticTexts() {
        const trans = TRANSLATIONS[currentLang];
        document.getElementById('pageTitle').innerText = trans.pageTitle;
        document.getElementById('pageSubtitle').innerText = trans.pageSubtitle;
        document.getElementById('linkActive').innerText = trans.linkActive;
        document.getElementById('linkCustom').innerText = trans.linkCustom;
        document.getElementById('searchInput').placeholder = trans.searchPlaceholder;
        document.getElementById('btnShare').querySelector('span').innerText = trans.copyShareLink;
        document.getElementById('btnReset').querySelector('span').innerText = trans.resetBtn;
        document.getElementById('modalTitle').innerText = trans.modalTitle;
        document.getElementById('modalSearchInput').placeholder = trans.modalSearchPlaceholder;
        document.getElementById('tabAll').innerText = trans.tabAll;
        document.getElementById('tabActive').innerText = trans.tabActive;
        document.getElementById('tabCustom').innerText = trans.tabCustom;

        const btnHide = document.getElementById('btnHideEmptyToggle');
        if (btnHide) {
            btnHide.querySelector('span:first-child').innerText = isHideAllEmpty ? trans.hideAllEmptyText : trans.showAllEmptyText;
        }
        const btnDiff = document.getElementById('btnDiffToggle');
        if (btnDiff) {
            btnDiff.querySelector('span:first-child').innerText = trans.diffOnlyText;
        }
        const btnSmart = document.getElementById('btnViewSmart');
        if (btnSmart) {
            btnSmart.querySelector('span').innerText = trans.viewModeSmart;
        }
        const btnRaw = document.getElementById('btnViewRaw');
        if (btnRaw) {
            btnRaw.querySelector('span').innerText = trans.viewModeRaw;
        }
    }

    // Theme Switcher
    const themeToggleBtn = document.getElementById('themeToggle');
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark-theme');
            themeToggleBtn.textContent = '🌙';
        } else {
            document.documentElement.classList.remove('dark-theme');
            themeToggleBtn.textContent = '☀️';
        }
    }
    initTheme();

    themeToggleBtn.addEventListener('click', () => {
        if (document.documentElement.classList.contains('dark-theme')) {
            document.documentElement.classList.remove('dark-theme');
            themeToggleBtn.textContent = '☀️';
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.add('dark-theme');
            themeToggleBtn.textContent = '🌙';
            localStorage.setItem('theme', 'dark');
        }
    });

    // Keyboard ESC listener
    window.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeModelModal();
            closeImageModal();
        }
    });

    // Load Data
    function loadComparisonData() {
        const cacheBust = '?v=' + new Date().getTime();
        const masterFile = currentLang === 'en' ? 'bmw_master_specs_en.json' : 'bmw_master_specs.json';
        const customFile = currentLang === 'en' ? 'bmw_custom_specs_en.json' : 'bmw_custom_specs.json';

        Promise.all([
            fetch(masterFile + cacheBust).then(res => res.json()).catch(() => []),
            fetch(customFile + cacheBust).then(res => res.json()).catch(() => [])
        ]).then(([mJson, cJson]) => {
            masterData = Array.isArray(mJson) ? mJson : [];
            customData = Array.isArray(cJson) ? cJson : [];

            // Filter active models for masterData
            masterData = masterData.map(series => ({
                ...series,
                models: (series.models || []).filter(m => !m.is_custom_archived)
            })).filter(series => series.models.length > 0);

            masterData = sortSeriesData(masterData);
            customData = sortSeriesData(customData);

            buildFlatCatalog();

            // Check URL state first
            const hasUrlModels = parseUrlState();
            if (!hasUrlModels) {
                // Check localStorage tray
                const trayIds = loadTrayFromLocalStorage();
                if (trayIds) {
                    selectedModelIds = trayIds;
                } else if (flatCatalog.length >= 2) {
                    // Default to first 2 models in catalog
                    selectedModelIds = [flatCatalog[0].id, flatCatalog[1].id];
                }
            }

            renderComparator();
        }).catch(err => {
            console.error('Failed to load comparison specifications:', err);
        });
    }

    // Initial run
    loadComparisonData();
</script>
</body>
</html>
