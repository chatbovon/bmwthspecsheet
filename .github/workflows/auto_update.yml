name: BMW Auto-Update Specs

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 19 * * *' # Runs every day at 02:00 AM ICT (UTC+7 -> 19:00 UTC)
  workflow_dispatch: # Allows manual runs from the GitHub Actions tab
    inputs:
      only_scrape_images:
        description: 'Run ONLY image scraper (skips PDF download and PDF extraction)'
        type: boolean
        required: false
        default: false
      target_file:
        description: 'Target specific PDF pattern to re-extract (e.g. 3-20250625-01 or leave empty for all)'
        type: string
        required: false
        default: ''
      skip_email:
        description: 'Skip sending daily email report'
        type: boolean
        required: false
        default: false

jobs:
  update-specs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright pillow google-genai pypdf pypdfium2 python-dotenv requests google-api-python-client google-auth
        playwright install chromium

    - name: Run Scraper (Download new PDFs)
      if: ${{ github.event.inputs.only_scrape_images != 'true' }}
      run: |
        python pdf_scraper.py

    - name: Verify PDF Content Changes (Smart-Skip Identical PDFs)
      if: ${{ github.event.inputs.only_scrape_images != 'true' }}
      run: |
        python verify_pdf_content.py --lang all

    - name: Run Extractor & Compare (Process PDFs with Gemini)
      if: ${{ github.event.inputs.only_scrape_images != 'true' }}
      env:
        GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
        GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        MINERU_API_TOKEN: ${{ secrets.MINERU_API_TOKEN }}
        TARGET_FILE: ${{ github.event.inputs.target_file }}
      run: |
        if [ -n "$TARGET_FILE" ]; then
          echo "[ACTION] Target file specified: $TARGET_FILE. Running targeted re-extraction for TH and EN..."
          python -u batch_extractor.py --lang th --file "$TARGET_FILE"
          python -u batch_extractor.py --lang en --file "$TARGET_FILE"
        else
          echo "[ACTION] Running standard batch extraction for all new brochures..."
          python -u batch_extractor.py --lang th
          python -u batch_extractor.py --lang en
        fi
        python -u scratch/compare_th_en_db.py

    - name: Automatically Archive Discontinued Models
      if: ${{ github.event.inputs.only_scrape_images != 'true' }}
      run: |
        python scratch/archive_discontinued.py

    - name: Run Auto-Image Scraper (Download missing vehicle previews)
      run: |
        python auto_image_scraper.py

    - name: Upload PDFs to Google Drive
      if: ${{ github.event.inputs.only_scrape_images != 'true' }}
      continue-on-error: true
      env:
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      run: |
        python scratch/upload_to_gdrive.py

    - name: Generate Run Report
      continue-on-error: true
      run: |
        python scratch/generate_report.py

    - name: Generate Model Dossiers for NotebookLM
      continue-on-error: true
      run: |
        python generate_model_dossier.py

    - name: Send Daily Email Report (via GAS Web App)
      if: ${{ github.event.inputs.skip_email != 'true' }}
      continue-on-error: true
      env:
        GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
        GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        MINERU_API_TOKEN: ${{ secrets.MINERU_API_TOKEN }}
        GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        GAS_SECRET_TOKEN: ${{ secrets.GAS_SECRET_TOKEN }}
      run: |
        python send_daily_report.py

    - name: Manage GitHub Issues on Critical Errors
      if: always()
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python scratch/manage_github_issues.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Ensure we are on the correct branch before pushing (prevent detached HEAD error)
        git checkout ${{ github.head_ref || github.ref_name }}
        git pull --rebase origin ${{ github.head_ref || github.ref_name }} || true
        
        # Check if there are any database or audit changes
        git add bmw_master_specs.json bmw_master_specs_en.json bmw_custom_specs.json bmw_custom_specs_en.json specsheet_audit_report.md .nojekyll generate_model_dossier.py
        git add -f dossier/ || true
        git add -f bmw_ai_specs.json bmw_ai_specs_en.json || true
        git add -f images/**/*.png || true

        # Smart Fallback for PDFs:
        # If Google Drive failed, commit PDFs to repository as emergency backup so files are not lost.
        # If Google Drive succeeded, keep repository clean.
        python scratch/sync_pdf_fallback.py || true

        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "Auto-update: New brochures, specifications, images, dossiers and audit report [skip ci]"
          git push
        else
          git status
          echo "No changes to commit"
        fi
